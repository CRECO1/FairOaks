<!--
  Elkhorn Point — email hero header.

  Replaces the solid black header block at the top of the campaign emails with the
  development rendering as the background, headline reversed out over it.

  How it degrades:
    • Modern clients (Gmail, Apple Mail, iOS, Outlook.com, Yahoo): rendering as the
      hero background with a dark scrim over it so the type stays readable.
    • Outlook desktop (Word engine — no background-image support): keeps the original
      black header, and the rendering is shown full-width just under the gold band.
    • Images off / blocked: falls back to #1A1A1A, i.e. exactly the old header.

  Swap {{EYEBROW}} and {{HEADLINE}} for the variant's own text. Paste in the
  campaign editor's HTML mode — the rich-text mode strips conditional comments.
-->

<!--[if mso]>
<tr>
  <td style="background:#1A1A1A;padding:28px 40px;">
    <p style="margin:0;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#C9922C;font-weight:700;">{{EYEBROW}}</p>
    <h1 style="margin:8px 0 0;font-size:22px;color:#ffffff;font-weight:700;line-height:1.3;">{{HEADLINE}}</h1>
  </td>
</tr>
<![endif]-->
