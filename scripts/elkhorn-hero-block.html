<!--
  Elkhorn Point — email hero.

  The rendering goes in as a real <img> at the very top, with the headline on a
  black band directly beneath it, above the gold NOW PRE-LEASING band.

  An earlier version used the rendering as a CSS background with the type over
  it. Gmail strips background-image on a <td> and fell back to a black box, so
  the picture never appeared. A plain <img> renders everywhere — Gmail, Apple
  Mail, Outlook desktop included — and needs no VML or conditional comments.

  THE ASSET (export this from the rendering and upload it before sending):

    file        hero-elkhorn-point.jpg  →  https://elkhornpoint.com/hero-elkhorn-point.jpg
    size        1200 px wide (drawn at 600 — 2× for retina), 2:1 to 16:9
    crop        the building rendering itself, framed as the landing page hero
                frames it, not the two-building split composite
    weight      under ~250 KB, progressive JPEG

  No baked shading needed now — no type sits on the image.

  Swap {{EYEBROW}} and {{HEADLINE}} for the variant's own text.
-->

<tr>
  <td style="padding:0;background:#1A1A1A;line-height:0;font-size:0;">
    <img src="https://elkhornpoint.com/hero-elkhorn-point.jpg" width="600" alt="Elkhorn Point — new neighborhood retail center on Dietz Elkhorn Road in Fair Oaks Ranch" style="display:block;width:100%;max-width:600px;height:auto;border:0;" />
  </td>
</tr>
<tr>
  <td style="background:#1A1A1A;padding:26px 40px 30px;">
    <p style="margin:0;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#C9922C;font-weight:700;">{{EYEBROW}}</p>
    <h1 style="margin:9px 0 0;font-size:24px;color:#ffffff;font-weight:700;line-height:1.3;">{{HEADLINE}}</h1>
  </td>
</tr>
